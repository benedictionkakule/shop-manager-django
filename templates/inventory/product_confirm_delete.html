{% extends "base.html" %}
{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="card border-danger">
  <div class="card-body">
    <h2>Delete product?</h2>
    <p>Are you sure you want to delete <strong>{{ object.name }}</strong>? This can't be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'product_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
