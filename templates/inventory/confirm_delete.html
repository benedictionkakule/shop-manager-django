{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}

{% block content %}
<div class="card border-danger">
  <div class="card-body">
    <h2>Delete record?</h2>
    <p>Are you sure you want to delete <strong>{{ object }}</strong>? This can't be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{{ view.success_url }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
